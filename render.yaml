databases:
  - name: savr-db
    databaseName: savr
    user: savr
    plan: free

services:
  # ── Flask backend ──────────────────────────────────────────────────────────
  - type: web
    name: savr-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: savr-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://savr.vercel.app   # update to your Vercel URL

  # ── React frontend ─────────────────────────────────────────────────────────
  - type: web
    name: savr-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: savr-backend
          type: web
          property: host
